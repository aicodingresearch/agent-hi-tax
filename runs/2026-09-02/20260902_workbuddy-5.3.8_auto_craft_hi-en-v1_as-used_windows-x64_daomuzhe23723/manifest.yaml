  notes: "This retest changes two variables at once relative to the reference sample; any numeric difference must not be attributed to a single cause. It is also the first Windows WorkBuddy package (relevant to T-16)."

protocol:
  deviations:
    - "WorkBuddy is a desktop IDE: terminal commands prepared and verified empty directories, while folder selection, mode confirmation, and prompt submission were manual GUI actions."
    - "The fixed requested model Auto routed all three attempts to deepseek-v4-flash; actual model is therefore an attempt result, not a fixed underlying-model scenario variable."
    - "The UI label 日常办公 and native SQLite mode craft describe different product layers and are both retained."
    - "Version 5.3.8 differs from the 5.3.13 reference sample: SQLite session_usage.credit_json keys are conversationRequestId (not messageId), and completed sessions are not soft-deleted after GUI workspace switching on 5.3.8."
    - "Input context drifted across attempts (+484 tokens in R3); this is attributed to account-level memory/profile injection between attempts, not to a protocol violation."
    - "Global context was observed in replies: R2 referenced the workspace basename, and R3 restated the user's long-term memory profile (resume parsing, iFLYTEK competition, CBDB research)."
    - "Subscription plan and account-level quota were not captured; exact per-attempt WorkBuddy credit remains verified."
    - "The external watcher is an observer, not a WorkBuddy hook; it reads completed records and makes no model call."
  notes: "This package measures the WorkBuddy Auto routing harness on Windows 5.3.8, not a controlled single-model benchmark."
