name: Refresh results index

# The root-level index pages are generated from the scenario packages and are
# deliberately not carried by the contributions that add those packages (see
# CONTRIBUTING.md). This workflow is what keeps them current: after a merge it
# rebuilds them and, when that changes anything, opens or updates a single
# standing pull request — and then, if the standing pull request is provably
# nothing but that generator output, adds it to the merge queue.
#
# The daily run is a watchdog for the case where that pull request was closed
# without merging, a push-triggered run failed, or the required checks outlasted
# the enqueue job's bounded wait. It is not the primary path: scheduled
# workflows can be delayed, dropped, or disabled on an idle public repository,
# so nothing depends on it firing.
#
# Trust boundary: every trigger here is either `main` moving or a maintainer
# asking, and every job checks out `main`. No job ever runs code from the pull
# request it is acting on.

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Serialize refreshes: two merges in quick succession must not race to push the
# same branch. Queue rather than cancel, so the last run always sees final main.
concurrency:
  group: refresh-results-index
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # `secrets` cannot be read from a step `if`, so the presence of the app is
      # decided once here. Until the app exists the workflow keeps using the
      # personal token, which is why nothing about this file has to be merged in
      # lock-step with creating it.
      HAS_APP: ${{ secrets.RESULTS_APP_ID != '' && secrets.RESULTS_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Mint a token for the results index app
        id: app-token
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RESULTS_APP_ID }}
          private-key: ${{ secrets.RESULTS_APP_PRIVATE_KEY }}

      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Not `GITHUB_TOKEN`: a pull request opened with it does not trigger
          # workflows, so the required `verify` check would never run and the
          # pull request could never merge. An app installation token does
          # trigger them, which is what replaces the personal token here.
          token: ${{ steps.app-token.outputs.token || secrets.BOT_TOKEN }}

      - name: Rebuild the index
        id: rebuild
        run: |
          python3 scripts/build-results-index.py >/dev/null
          if git diff --quiet -- RESULTS.md RESULTS.zh-CN.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "the committed index already matches the scenario packages"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- RESULTS.md RESULTS.zh-CN.md
          fi

      - name: Open or update the refresh pull request
        if: steps.rebuild.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.BOT_TOKEN }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          BRANCH: chore/refresh-results-index
          PR_BODY: |
            Regenerated by `scripts/build-results-index.py` from the scenario
            packages on `main`.

            `RESULTS.md` and `RESULTS.zh-CN.md` are derived files, so there is no
            judgement here to review: either they match the generator output,
            which the `verify` check confirms, or they do not and it fails. This
            pull request exists so that keeping them current needs no direct push
            to `main`.

            The branch is rebuilt and force-pushed after every merge that changes
            the index, so it reflects current `main` rather than the state when it
            was first opened.
        run: |
          set -eu

          # Commit as whoever is pushing. When the app is in use that is the
          # app's own bot account, so the commit is attributed to the identity
          # that actually made it rather than to a person who did not.
          if [ -n "${APP_SLUG:-}" ]; then
            bot_id=$(gh api "users/${APP_SLUG}%5Bbot%5D" --jq .id)
            git config user.name "${APP_SLUG}[bot]"
            git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          else
            git config user.name "YIN Keting"
            git config user.email "keting@users.noreply.github.com"
          fi

          git checkout -B "$BRANCH"
          git add RESULTS.md RESULTS.zh-CN.md
          git commit -m "chore: refresh results index"

          # The branch is owned by this workflow and always regenerated from
          # current main, so replacing it wholesale is the intended update.
          git push --force origin "$BRANCH"

          state=$(gh pr view "$BRANCH" --json state --jq .state 2>/dev/null || echo "")
          if [ "$state" = "OPEN" ]; then
            echo "updated the open pull request for $BRANCH"
            exit 0
          fi

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: refresh results index" \
            --body "$PR_BODY"

  enqueue:
    # Runs whether or not the refresh changed anything: the standing pull
    # request may already be open and green from an earlier run. It also runs
    # after a failed refresh, because every claim it makes about the pull
    # request is re-verified from scratch — a half-finished push fails the
    # content comparison rather than sneaking through.
    needs: refresh
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # The script bounds itself on both wall clock and request budget; this is
    # the outer stop so a wedged runner cannot sit for an hour.
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
    env:
      HAS_APP: ${{ secrets.RESULTS_APP_ID != '' && secrets.RESULTS_APP_PRIVATE_KEY != '' }}
    steps:
      # `main`, never the pull request branch: the generator, the verifier and
      # the file allowlist all have to come from code a maintainer merged.
      - name: Check out trusted main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Record the commit the comparison is made against
        id: trusted
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Mint a token for the results index app
        id: app-token
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RESULTS_APP_ID }}
          private-key: ${{ secrets.RESULTS_APP_PRIVATE_KEY }}

      - name: Report which identity would enqueue
        run: |
          echo "app configured: ${HAS_APP}"
          echo "app slug: ${APP_SLUG:-<none>}"
          echo "auto-enqueue switch: ${SWITCH:-<unset>}"
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          SWITCH: ${{ vars.RESULTS_AUTO_ENQUEUE_ENABLED }}

      # Verification reads run on the workflow's own token, which is scoped by
      # the `permissions` block above. The app token is passed separately and is
      # used for exactly one call: `enqueuePullRequest`. Keeping them apart is
      # what lets the app stay on Contents and Pull requests alone.
      - name: Verify the refresh pull request and enqueue it
        env:
          REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          ENQUEUE_TOKEN: ${{ steps.app-token.outputs.token }}
          TRUSTED_MAIN_SHA: ${{ steps.trusted.outputs.sha }}
          RESULTS_AUTO_ENQUEUE_ENABLED: ${{ vars.RESULTS_AUTO_ENQUEUE_ENABLED }}
        run: python3 scripts/auto_enqueue_results_pr.py
