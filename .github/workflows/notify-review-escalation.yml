name: Notify owner about assigned or stale reviews

on:
  pull_request_target:
    branches:
      - main
    types:
      - review_requested
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Notification mode
        required: true
        default: watchdog
        type: choice
        options:
          - watchdog
          - assigned-to-keting
      pull_request_number:
        description: Required for assigned-to-keting
        required: false
        type: number
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
      pull_request_number:
        required: false
        type: number
    secrets:
      APPROVAL_SMTP_HOST:
        required: true
      APPROVAL_SMTP_PORT:
        required: true
      APPROVAL_SMTP_USER:
        required: true
      APPROVAL_SMTP_AUTH_CODE:
        required: true
      APPROVAL_NOTIFY_TO:
        required: true

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: review-email-${{ github.event.pull_request.number || inputs.pull_request_number || 'watchdog' }}
  cancel-in-progress: false

jobs:
  notify:
    if: inputs.mode != '' || github.event_name != 'pull_request_target' || github.event.requested_reviewer.login == 'keting'
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted notification code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Notify only for an owner assignment or a stale review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_PR_NUMBER: ${{ inputs.pull_request_number }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          SMTP_HOST: ${{ secrets.APPROVAL_SMTP_HOST }}
          SMTP_PORT: ${{ secrets.APPROVAL_SMTP_PORT }}
          SMTP_USER: ${{ secrets.APPROVAL_SMTP_USER }}
          SMTP_AUTH_CODE: ${{ secrets.APPROVAL_SMTP_AUTH_CODE }}
          NOTIFY_TO: ${{ secrets.APPROVAL_NOTIFY_TO }}
          REVIEW_ESCALATION_HOURS: "24"
        run: |
          mode="$INPUT_MODE"
          pr_number="$INPUT_PR_NUMBER"

          if [ -z "$mode" ]; then
            if [ "$EVENT_NAME" = "pull_request_target" ]; then
              mode="assigned-to-keting"
              pr_number="$EVENT_PR_NUMBER"
            else
              mode="watchdog"
            fi
          fi

          args=(--mode "$mode")
          if [ -n "$pr_number" ]; then
            args+=(--pull-request-number "$pr_number")
          fi
          python3 scripts/notify_review_escalation.py "${args[@]}"
